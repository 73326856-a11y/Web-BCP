<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soluciones de Cobro | Demo BCP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.svg">
</head>
<body data-segment="pymes">
  <div id="app-header"></div>

  <section class="cobros-hero" style="background-image:url('https://images.unsplash.com/photo-1556740738-b6a63b52b176?auto=format&fit=crop&w=1600&q=80')">
    <div class="container">
      <h1>Soluciones de Cobro</h1>
      <div class="compare">
        <article class="compare-card">
          <h2 class="izi-head">Izipay</h2>
          <div class="compare-body">
            <div class="pill-navy">COMISIÓN POR VENTA<br>(3.45% + S/7.9)</div>
            <div class="pill-navy">MANTENIMIENTO MENSUAL<br>(Variable/S/X)</div>
            <div class="pill-navy">TRANSACCIONES MENSUALES<br>(ej. 1000)</div>
            <div class="pill-navy">COSTO TOTAL ESTIMADO:<br>S/XXX</div>
          </div>
        </article>
        <article class="compare-card">
          <h2 class="culqi-head">Culqi</h2>
          <div class="compare-body">
            <div class="pill-orange">COMISIÓN POR VENTA<br>(3.44% + S/7.9)</div>
            <div class="pill-orange">MANTENIMIENTO MENSUAL<br>(S/0)</div>
            <div class="pill-orange">TRANSACCIONES MENSUALES<br>(ej. 1000)</div>
            <div class="pill-orange">COSTO TOTAL ESTIMADO:<br>S/YYY</div>
          </div>
        </article>
      </div>
    </div>
  </section>

  <div id="app-footer"></div>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
